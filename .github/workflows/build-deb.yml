name: Build Debian package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            debhelper \
            devscripts \
            lintian

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc

      - name: Run lintian
        run: |
          lintian ../*.changes

      - name: Copy Debian package
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
          ls -lh artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: internet-applet-deb
          path: artifacts/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb
