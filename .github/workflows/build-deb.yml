name: Build Debian package

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            debhelper \
            devscripts \
            lintian

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc

      - name: Run lintian
        run: |
          lintian ../*.changes

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: internet-applet-deb
          path: ../*.deb
